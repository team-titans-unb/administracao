name: mkdocs-material

on:
  push:
    branches:
      - master
      - main
  # Regera o site para atualizar o quadro Kanban da Home
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV 


      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      # Mesmas versões usadas localmente (requirements.txt)
      - run: pip install -r requirements.txt
      - run: mkdocs gh-deploy --force --strict
        env:
          # PAT com permissão de leitura em Projects da organização (ver README)
          KANBAN_TOKEN: ${{ secrets.KANBAN_TOKEN }}
